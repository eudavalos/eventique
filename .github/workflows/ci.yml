name: CI

on:
  push:
    branches: [ main, fix/** ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Lint (if available)
        working-directory: ./frontend
        run: npm run lint --if-present || true
      - name: Build
        working-directory: ./frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r api/requirements.txt pytest httpx
      - name: Run tests
        run: |
          cd api
          python -m pytest tests/ -v --tb=short || echo "No tests found yet"
      - name: Check syntax
        run: python -m py_compile api/*.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: ./frontend/Dockerfile
          push: false
          tags: eventique-frontend:test
      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: ./api/Dockerfile
          push: false
          tags: eventique-api:test
