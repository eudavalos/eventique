server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # ── API proxy → FastAPI container ────────────────────────
    location /api/ {
        client_max_body_size 55m;
        proxy_pass         http://api:8700/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 30s;
    }

    # ── API Docs — Swagger UI ──────────────────────────────
    location /docs {
        proxy_pass         http://api:8700/docs;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_redirect     off;
    }

    location /openapi.json {
        proxy_pass         http://api:8700/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── Uploaded media — proxy to FastAPI ───────────────────
    location /s/ {
        proxy_pass         http://api:8700/s/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
    }

    location /uploads/ {
        proxy_pass         http://api:8700/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_cache_valid  200 7d;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Static assets — cache agresivo ───────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /photos/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /music/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── React SPA ─────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
